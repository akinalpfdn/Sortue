<script>
const p=new URLSearchParams(location.search),device=p.get('device')==='ipad'?'ipad':'iphone',n=Math.max(1,Math.min(4,Number(p.get('slide'))||1)),pad=device==='ipad';
const slides=[
{cls:'one',title:'A little color.<br><em>A clearer mind.</em>',desc:'Unwind, one puzzle<br>at a time.'},
{cls:'two',title:'Every shade.<br><em>In its place.</em>',desc:'Swap the tiles.<br>Restore the harmony.'},
{cls:'three',title:'Start small.<br><em>Go deeper.</em>',desc:'Find your flow.<br>From 4 × 4 to 12 × 12.'},
{cls:'four',title:'A palette for<br><em>every mood.</em>',desc:'A fresh blend.<br>With every puzzle.'}
];
const s=slides[n-1];document.body.className=device+' '+s.cls;document.querySelector('.copy').innerHTML=`<h1 data-store-role="headline">${s.title}</h1><p data-store-role="support" class="desc">${s.desc}</p>`;document.querySelector('#number').textContent=`0${n} / 04`;
// Crop native screenshots in CSS. Tile colors, arrangement, and spacing remain untouched.
const crops={
 'iphone-small':{w:1206,x:96,y:777,size:1014},
 'iphone-violet':{w:1206,x:96,y:777,size:1014},
 'iphone-blue':{w:1206,x:96,y:777,size:1014},
 'iphone-win':{w:1206,x:96,y:777,size:1014},
 'ipad-green':{w:1640,x:64,y:375,size:1512},
 'ipad-multi':{w:1640,x:64,y:375,size:1512},
 'ipad-teal':{w:1640,x:64,y:375,size:1512}
};
function crop(key){const c=crops[key];return `<div class="crop"><img src="assets/${key}.png" alt="Sortue color puzzle" style="width:${c.w/c.size*100}%;left:${-c.x/c.size*100}%;top:${-c.y/c.size*100}%"></div>`}
function board(key,cls,label=''){return `<div class="board ${cls}">${label?`<span class="tag" data-store-role="label">${label}</span>`:''}${crop(key)}</div>`}
let html='';
if(n===1)html=pad?board('ipad-teal','hero'):`<div class="device"><img src="assets/iphone-violet.png" alt="Sortue on iPhone"></div>`;
if(n===2)html=`<div class="section-label caption">Beautifully in balance</div>`+board(pad?'ipad-multi':'iphone-blue','main')+`<div class="under"><strong>Small moves. Satisfying gradients.</strong><div class="swatches">${['#a7e4ed','#78bddf','#6385ce','#8374bc','#b591cc'].map(c=>`<span style="background:${c}"></span>`).join('')}</div>`;
if(n===3)html=board(pad?'ipad-green':'iphone-small','small','4 × 4')+`<div class="connector" data-store-ignore="icon">↳</div>`+board(pad?'ipad-teal':'iphone-violet','large',pad?'11 × 11':'7 × 7');

document.querySelector('#visual').innerHTML=html;document.title=`Sortue ${device} ${n}`;
