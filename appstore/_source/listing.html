/* Localization layer. Base layout above is unchanged from en/listing.html. */

</style><script src="copy.js"></script></head><body><main class="art"><div class="brand" data-store-role="label"><img src="../en/assets/icon.png" alt="">sortue</div><div class="copy"></div><div class="orb"></div><div id="visual"></div></main>
<script>
const p=new URLSearchParams(location.search),device=p.get('device')==='ipad'?'ipad':'iphone',n=Math.max(1,Math.min(4,Number(p.get('slide'))||1)),pad=device==='ipad';
const locale=COPY[p.get('locale')]?p.get('locale'):'en-US',lang=locale.replace(/-(US|DE|FR|ES|NL|SA)$/,'').replace(/^no$/,'nb');
const rtl=['ar','he'].includes(lang),wide=['ja','ko','zh-Hans','zh-Hant','th','hi','ar'].includes(lang),tall=['th','hi','ar','vi'].includes(lang);
document.documentElement.lang=lang;if(rtl)document.body.dir='rtl';
const [h1a,h1b,d1,d2]=COPY[locale][n-1],esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
const cls=['one','two','three','four'][n-1];
document.body.className=[device,cls,wide?'wide-script':'',tall?'tall-script':''].join(' ').trim();if(rtl)document.body.dir='rtl';
document.querySelector('.copy').innerHTML=`<h1 data-store-role="headline"><span class="l">${esc(h1a)}</span><em class="l">${esc(h1b)}</em></h1><p data-store-role="support" class="desc"><span class="l">${esc(d1)}</span><span class="l">${esc(d2)}</span></p>`;
const crops={
 'iphone-small':{w:1206,x:96,y:777,size:1014},
 'iphone-violet':{w:1206,x:96,y:777,size:1014},
 'iphone-blue':{w:1206,x:96,y:777,size:1014},
 'iphone-win':{w:1206,x:96,y:777,size:1014},
 'ipad-green':{w:1640,x:64,y:375,size:1512},
 'ipad-multi':{w:1640,x:64,y:375,size:1512},
 'ipad-teal':{w:1640,x:64,y:375,size:1512}
};
function crop(key){const c=crops[key];return `<div class="crop"><img src="../en/assets/${key}.png" alt="Sortue color puzzle" style="width:${c.w/c.size*100}%;left:${-c.x/c.size*100}%;top:${-c.y/c.size*100}%"></div>`}
function board(key,cls,label=''){return `<div class="board ${cls}">${label?`<span class="tag" data-store-role="label">${label}</span>`:''}${crop(key)}</div>`}
let html='';
if(n===1)html=pad?board('ipad-teal','hero'):`<div class="device"><img src="../en/assets/iphone-violet.png" alt="Sortue on iPhone"></div>`;
if(n===2)html=board(pad?'ipad-multi':'iphone-blue','main');
if(n===3)html=board(pad?'ipad-green':'iphone-small','small','4 × 4')+`<div class="connector" data-store-ignore="icon">↳</div>`+board(pad?'ipad-teal':'iphone-violet','large',pad?'11 × 11':'7 × 7');
if(n===4)html=board(pad?'ipad-multi':'iphone-violet','palette-a')+board(pad?'ipad-teal':'iphone-blue','palette-b')+board(pad?'ipad-green':'iphone-win','palette-c');
document.querySelector('#visual').innerHTML=html;document.title=`Sortue ${locale} ${device} ${n}`;
// Shrink a line group until every line fits the copy column, but never below the 320px-preview minimum.
window.layoutReady=document.fonts.ready.then(()=>{
 const W=document.querySelector('.art').clientWidth,copy=document.querySelector('.copy');
 const fit=(el,minPx)=>{let size=parseFloat(getComputedStyle(el).fontSize);const lines=[...el.querySelectorAll('.l')];
  while(size>minPx&&lines.some(l=>l.scrollWidth>copy.clientWidth)){size=Math.max(minPx,size-0.5);el.style.fontSize=size+'px'}
  if(lines.some(l=>l.scrollWidth>copy.clientWidth))lines.forEach(l=>l.style.whiteSpace='normal');};
 fit(copy.querySelector('h1'),Math.ceil(28*W/320*10)/10);fit(copy.querySelector('.desc'),Math.ceil(18*W/320*10)/10);
 const vis=[...document.querySelectorAll('#visual .device,#visual .board')].map(e=>e.getBoundingClientRect().top);
 window.layout={copyBottom:copy.getBoundingClientRect().bottom,visualTop:Math.min(...vis),wrapped:[...copy.querySelectorAll('.l')].some(l=>l.style.whiteSpace==='normal')};
});
</script></body></html>
